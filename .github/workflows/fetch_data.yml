# Data relay: some servers (e.g. the owner's VPS) cannot reach STFC because their IP range is blocked there.
# GitHub's machines can, so this job downloads the shots and attaches them as a short-lived artifact, which the
# research server downloads (src/relay.py). Only public MAST data passes through here; nothing is committed.
name: fetch_data

on:
  workflow_dispatch:
    inputs:
      scale:
        description: "small (300+300 shots) or full (every disruption + 3000 clean)"
        default: full
        type: choice
        options: [small, full]

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MAST_HOME: ${{ github.workspace }}/relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: download shots
        run: python scripts/relay_fetch.py --scale ${{ inputs.scale }}
      - uses: actions/upload-artifact@v4
        with:
          name: mast-data
          path: relay/data
          retention-days: 1
          if-no-files-found: error
